name: CI

on:
  push:
    branches: ["master", "phase30/**", "phase**"]
  pull_request:
    branches: ["master", "phase30/**", "phase**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint (src, tests, scripts)
        run: ruff check src tests scripts

      # Les scripts d'ops (dont l'entrypoint du cron VPS) n'avaient jusqu'ici ni
      # test ni lint, alors qu'ils sont le seul pipeline cense tourner en prod.
      - name: Shell syntax check (ops scripts)
        run: bash -n scripts/*.sh

      - name: Shellcheck (errors only)
        run: shellcheck -S error scripts/*.sh

      - name: Pytest collect sanity
        run: python -m pytest --collect-only -q

      - name: Run pytest (mock CLI transport)
        env:
          KRAKEN_CLI_TRANSPORT: mock
          TRADING_MODE: dry_run
          LIVE_TRADING: "false"
          ALLOW_LIVE_ORDERS: "false"
        run: python -m pytest -q

      # Garde-fou : aucun test ni script ne doit reecrire un fichier suivi par git.
      # Un rapport de recherche versionne a ete silencieusement remplace par la
      # sortie d'une fixture pytest pendant trois mois faute de ce controle
      # (scripts/audit_data_backbone_phase24.py ecrivait dans un chemin en dur).
      - name: No tracked file was rewritten by the test run
        run: git diff --exit-code
