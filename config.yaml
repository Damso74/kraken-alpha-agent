competition:
  name: "AI Agent Olympics - Kraken Trading Performance"
  alias_public: "Kraken Sentinel"
  agent_codename: "Kraken Alpha Agent"
  starting_equity_usd: 10000.0

# Active profile applied on top of the base config below. See `profiles:`.
# Switched to aggressive_competition for the 15:30 CEST competition session.
# Live opt-in (TRADING_MODE/LIVE_TRADING/ALLOW_LIVE_ORDERS env vars) is
# unchanged — this profile flip never opens any live trading path.
profile: aggressive_competition

trading:
  mode: dry_run
  base_currency: USD
  cycle_interval_seconds: 60
  max_decisions_per_minute: 4
  # Calibration knobs (see README "Calibration knobs"). Lowered for the
  # competition session so the agent acts on smaller-edge opportunities.
  min_opportunity_score_buy: 0.08
  min_opportunity_score_sell: 0.10
  sell_exit_only: true
  shorting_enabled: false      # PRESERVED: shorting stays disabled
  no_trade_if_negative_opportunity: true
  liquidity_size_dampener: 0.5
  liquidity_size_factor: 0.5
  # Session guard: BUY only fires when the current US session is in this
  # list. SELL exits and HOLDs are unrestricted. Set [] to disable.
  allowed_entry_sessions: ["US_CORE"]

# Deterministic exit-rules engine (src/exit_rules.py). Profile-level
# risk.stop_loss_pct / risk.take_profit_pct take precedence when set.
exit:
  stop_loss_pct: 1.5
  take_profit_pct: 2.0
  momentum_exit_score: -0.03
  max_hold_minutes: 90
  stale_position_min_pnl_pct: 0.3
  flatten_before_close_minutes: 15

universe:
  mode: dynamic               # static | dynamic — competition uses dynamic top-N
  symbols:                    # static allowlist; also the candidate pool for dynamic
    - NVDAx
    - TSLAx
    - AAPLx
    - MSFTx
    - AMZNx
    - GOOGLx
    - METAx
    - SPYx
    - QQQx
    - MSTRx
    - HOODx
    - CRCLx
    - GLDx
  quote: USD
  allow_outside_market_hours: true
  max_spread_bps: 100         # dynamic filter — slightly wider for thin xStocks books
  min_trade_count: 10         # dynamic filter
  min_volume: 100             # dynamic filter
  top_n: 5                    # dynamic mode: keep top-N by opportunity_score
  ranking_cache_seconds: 60

strategy:
  ensemble_weights:
    momentum: 0.40
    breakout: 0.25
    mean_reversion: 0.20
    liquidity: 0.10
    volatility_penalty: 0.10
    spread_penalty: 0.05
  thresholds:
    buy: 0.20
    sell: -0.20
  min_confidence_to_trade: 0.30

risk:
  max_open_positions: 5
  max_position_notional_usd: 1500.0
  max_total_exposure_usd: 6000.0
  max_daily_drawdown_pct: 5.0
  max_spread_bps: 60
  cooldown_seconds_per_symbol: 90
  block_unknown_symbol: true
  block_if_regime: ["LOW_LIQUIDITY", "HIGH_VOLATILITY"]
  stop_loss_pct: 1.5
  take_profit_pct: 2.5
  max_trades_per_hour: 20

execution:
  default_order_type: market
  dry_run_size_usd: 250.0
  paper_size_usd: 250.0
  live_size_usd: 100.0
  require_validate_first: true
  dead_mans_switch_seconds: 120
  # spot keeps the active competition profile on the legacy xStocks Spot
  # routing. Only the micro_live_100eur profile flips to engine: futures
  # to use the Kraken Futures Perpetual venue at 1x leverage.
  engine: spot

# Kraken Futures Perpetual xStocks pivot. The block is read by
# src/risk.py (max_leverage + funding gate) and src/futures_kraken_cli.py
# (symbol mapping override). max_leverage is INTRANSIGEANT — the risk
# gate refuses anything > 1.0 regardless of where the value came from.
futures:
  enabled: false
  max_leverage: 1.0
  max_funding_rate_pct_per_hour: 0.5
  dry_run_mode_uses_paper_engine: true
  symbol_mapping: {}

llm:
  enabled: false
  base_url: "https://api.featherless.ai/v1"
  model: ""
  timeout_seconds: 20
  allow_override: false

logging:
  level: INFO
  mask_secrets: true

dashboard:
  host: "127.0.0.1"
  port: 8000
  refresh_seconds: 5

# Profile-specific overrides. Only the keys that differ from the base config
# need to be listed; everything else falls through to the values above.
profiles:
  balanced:
    description: "Default profile. Reasonable thresholds, max 5 positions."
    strategy:
      ensemble_weights:
        momentum: 0.40
        breakout: 0.25
        mean_reversion: 0.20
        liquidity: 0.10
        volatility_penalty: 0.10
        spread_penalty: 0.05
      thresholds: { buy: 0.20, sell: -0.20 }
      min_confidence_to_trade: 0.30
    risk:
      max_open_positions: 5
      max_position_notional_usd: 1500.0
      max_total_exposure_usd: 6000.0
      max_daily_drawdown_pct: 5.0
      max_spread_bps: 60
      cooldown_seconds_per_symbol: 90
      stop_loss_pct: 1.5
      take_profit_pct: 2.5
      max_trades_per_hour: 20

  aggressive_competition:
    description: "Higher activity for the trading-performance track. Live opt-in unchanged."
    strategy:
      ensemble_weights:
        momentum: 0.45
        breakout: 0.30
        mean_reversion: 0.15
        liquidity: 0.10
        volatility_penalty: 0.08
        spread_penalty: 0.04
      thresholds: { buy: 0.15, sell: -0.15 }
      min_confidence_to_trade: 0.22
    risk:
      max_open_positions: 8
      max_position_notional_usd: 2500.0
      max_total_exposure_usd: 12000.0
      max_daily_drawdown_pct: 6.0
      max_spread_bps: 80
      cooldown_seconds_per_symbol: 45
      stop_loss_pct: 1.2
      take_profit_pct: 2.0
      max_trades_per_hour: 40

  conservative_debug:
    description: "Tight thresholds for local debugging."
    strategy:
      ensemble_weights:
        momentum: 0.35
        breakout: 0.20
        mean_reversion: 0.25
        liquidity: 0.15
        volatility_penalty: 0.15
        spread_penalty: 0.08
      thresholds: { buy: 0.30, sell: -0.30 }
      min_confidence_to_trade: 0.45
    risk:
      max_open_positions: 2
      max_position_notional_usd: 500.0
      max_total_exposure_usd: 1500.0
      max_daily_drawdown_pct: 3.0
      max_spread_bps: 40
      cooldown_seconds_per_symbol: 180
      stop_loss_pct: 1.0
      take_profit_pct: 1.8
      max_trades_per_hour: 6

  # Tiny live-mode profile capped at a 30 USD total exposure ceiling.
  # NEVER active by default. Activated only when KRAKEN_ALPHA_PROFILE=
  # micro_live_100eur. The triple opt-in (TRADING_MODE=live +
  # LIVE_TRADING=true + ALLOW_LIVE_ORDERS=true) is still required;
  # shorting stays disabled regardless of this profile.
  micro_live_100eur:
    description: "Live micro-account ceiling (100€ wallet, 30€ exposure cap, Kraken Futures Perpetual xStocks @ 1x)."
    trading:
      shorting_enabled: false
      min_opportunity_score_buy: 0.08
      min_opportunity_score_sell: 0.06
    strategy:
      thresholds: { buy: 0.08, sell: -0.06 }
      min_confidence_to_trade: 0.25
    risk:
      max_open_positions: 3
      max_position_notional_usd: 10.0
      max_total_exposure_usd: 30.0
      max_daily_drawdown_pct: 3.0
      max_spread_bps: 80
      cooldown_seconds_per_symbol: 120
      stop_loss_pct: 1.5
      take_profit_pct: 2.0
      max_trades_per_hour: 6
    execution:
      dry_run_size_usd: 10.0
      paper_size_usd: 10.0
      live_size_usd: 10.0
      require_validate_first: true
      dead_mans_switch_seconds: 60
      # Pivot the live engine to Kraken Futures Perpetual xStocks. The spot
      # xStocks orderbook is blocked for EU/PEDSL-CY accounts, so we route
      # the same alpha through the perpetual venue, capped at 1x leverage
      # (= spot equivalent, no margin call surface).
      engine: futures
    futures:
      enabled: true
      max_leverage: 1.0
      max_funding_rate_pct_per_hour: 0.5
      dry_run_mode_uses_paper_engine: true
      symbol_mapping: {}

  # ---------------------------------------------------------------------
  # Shadow xStocks 36h profile — used by the hackathon-window dry_run
  # session (May 18 → 20, 2026). NEVER places a real order: the profile
  # forces ``execution.engine: spot`` and the launcher in
  # ``scripts/launch_shadow_xstocks.ps1`` exports
  # ``TRADING_MODE=dry_run`` / ``LIVE_TRADING=false`` /
  # ``ALLOW_LIVE_ORDERS=false`` before starting the loop. The
  # defense-in-depth tripwire in ``src/execution._assert_not_dry_run``
  # raises if a future refactor lets a dry_run request slip through to a
  # mutating CLI call.
  #
  # Strategy params mirror ``aggressive_competition`` (the profile that
  # produced the latest 30d backtest baseline) so the live shadow stream
  # is an apples-to-apples replay of the same alpha against real-time
  # xStocks tickers.
  shadow_xstocks_36h:
    description: "xStocks dry_run shadow session, 36-40h, hackathon window. NEVER places real orders."
    trading:
      mode: dry_run
      cycle_interval_seconds: 60
      shorting_enabled: false
      min_opportunity_score_buy: 0.08
      min_opportunity_score_sell: 0.10
      sell_exit_only: true
      no_trade_if_negative_opportunity: true
      allowed_entry_sessions: ["US_CORE"]
    universe:
      mode: dynamic
      symbols:
        - NVDAx
        - TSLAx
        - AAPLx
        - MSFTx
        - AMZNx
        - GOOGLx
        - METAx
        - SPYx
        - QQQx
        - MSTRx
        - HOODx
        - CRCLx
        - GLDx
      quote: USD
      max_spread_bps: 100
      min_trade_count: 10
      min_volume: 100
      top_n: 5
      ranking_cache_seconds: 60
    strategy:
      ensemble_weights:
        momentum: 0.45
        breakout: 0.30
        mean_reversion: 0.15
        liquidity: 0.10
        volatility_penalty: 0.08
        spread_penalty: 0.04
      thresholds: { buy: 0.15, sell: -0.15 }
      min_confidence_to_trade: 0.22
    risk:
      max_open_positions: 4
      max_position_notional_usd: 25.0
      max_total_exposure_usd: 100.0
      max_daily_drawdown_pct: 6.0
      max_spread_bps: 80
      cooldown_seconds_per_symbol: 45
      stop_loss_pct: 1.2
      take_profit_pct: 2.0
      max_trades_per_hour: 40
      # NB: LOW_LIQUIDITY removed because xStocks are structurally lower-
      # volume than legacy equities, so the regime detector flags them as
      # LOW_LIQUIDITY by default. Keeping HIGH_VOLATILITY as the only safety
      # gate (e.g. earnings spikes). Risk caps remain strict ($25 notional /
      # $100 total) so the dry_run shadow stream still mirrors a realistic
      # tiny-account behaviour.
      block_if_regime: ["HIGH_VOLATILITY"]
    execution:
      default_order_type: market
      dry_run_size_usd: 25.0
      paper_size_usd: 25.0
      live_size_usd: 25.0
      require_validate_first: true
      dead_mans_switch_seconds: 120
      engine: spot
    futures:
      enabled: false
      max_leverage: 1.0
      max_funding_rate_pct_per_hour: 0.5
      dry_run_mode_uses_paper_engine: false
      symbol_mapping: {}

  # Crypto Perps fallback profile (conservative defaults).
  #
  # When the xStocks track is venue-blocked at the account class layer
  # (e.g. PEDSL-CY where every xStocks Perp BUY/SELL is rejected with
  # status=wouldNotReducePosition), this profile re-routes the same
  # futures engine onto native crypto Perps (BTC/ETH/SOL/XRP/DOGE/AVAX/
  # LINK/ADA/DOT/LTC). It exists so the deterministic pipeline can still
  # be exercised end-to-end against real venue interaction without
  # bypassing any safeguard. Defaults committed here are intentionally
  # conservative (the same envelope as ``micro_live_100eur``): live use
  # always requires the triple opt-in.
  #
  # Notes:
  # - Leverage stays hardcoded at 1.0x (``futures.max_leverage`` is also
  #   clamped by ``risk.HARDCODED_MAX_LEVERAGE``; the wrapper raises on
  #   any value >1x).
  # - Shorting is disabled in the engine (no SELL without an open long).
  # - Funding-rate gate is left wide-open because crypto Perps publish
  #   funding on an 8h period (vs 1h for xStocks Perps); the existing
  #   per-hour cap would block every BUY on a profile that holds <30
  #   minutes anyway. The funding cost on a 30-minute hold is <0.001 USD
  #   per trade so the gate adds no protective value here.
  micro_live_100eur_crypto:
    description: "Crypto Perps fallback (BTC/ETH/SOL/... @ 1x, conservative caps, mirror of micro_live_100eur)."
    trading:
      shorting_enabled: false       # NEVER touch
      min_opportunity_score_buy: 0.05
      min_opportunity_score_sell: 0.05
      cycle_interval_seconds: 20    # 20s cycle (overridable via LOOP_INTERVAL_SECONDS)
      allowed_entry_sessions: []    # no session guard — crypto is 24/7
    universe:
      mode: static
      static:
        - "BTC"
        - "ETH"
        - "SOL"
        - "XRP"
        - "DOGE"
        - "AVAX"
        - "LINK"
        - "ADA"
        - "DOT"
        - "LTC"
      quote: USD
      max_spread_bps: 50
      top_n: 10
    strategy:
      thresholds: { buy: 0.05, sell: -0.05 }
      min_confidence_to_trade: 0.25
    risk:
      max_open_positions: 3
      max_position_notional_usd: 10.0   # USER CAP — mirror of micro_live_100eur
      max_total_exposure_usd: 30.0      # USER CAP — mirror of micro_live_100eur
      max_daily_drawdown_pct: 5.0
      max_spread_bps: 50
      cooldown_seconds_per_symbol: 60
      stop_loss_pct: 1.0
      take_profit_pct: 1.2
      max_trades_per_hour: 60
      block_if_regime: ["LOW_LIQUIDITY", "HIGH_VOLATILITY"]
    exit:
      time_stop_minutes: 30
      flatten_before_close_enabled: false
      momentum_exit_enabled: true
    execution:
      dry_run_size_usd: 10.0
      paper_size_usd: 10.0
      live_size_usd: 10.0
      require_validate_first: false
      dead_mans_switch_seconds: 60
      engine: futures
    futures:
      enabled: true
      max_leverage: 1.0               # NEVER touch — hard-capped by risk gate too
      max_funding_rate_pct_per_hour: 999.0
      dry_run_mode_uses_paper_engine: true
      symbol_mapping: {}
