competition:
  name: "AI Agent Olympics - Kraken Trading Performance"
  alias_public: "Kraken Sentinel"
  agent_codename: "Kraken Alpha Agent"
  starting_equity_usd: 10000.0

# Active profile applied on top of the base config below. See `profiles:`.
# Switched to aggressive_competition for the 15:30 CEST competition session.
# Live opt-in (TRADING_MODE/LIVE_TRADING/ALLOW_LIVE_ORDERS env vars) is
# unchanged — this profile flip never opens any live trading path.
profile: aggressive_competition

trading:
  mode: dry_run
  base_currency: USD
  cycle_interval_seconds: 60
  max_decisions_per_minute: 4
  # Calibration knobs (see README "Calibration knobs"). Lowered for the
  # competition session so the agent acts on smaller-edge opportunities.
  min_opportunity_score_buy: 0.08
  min_opportunity_score_sell: 0.10
  sell_exit_only: true
  shorting_enabled: false      # PRESERVED: shorting stays disabled
  no_trade_if_negative_opportunity: true
  liquidity_size_dampener: 0.5
  liquidity_size_factor: 0.5

universe:
  mode: dynamic               # static | dynamic — competition uses dynamic top-N
  symbols:                    # static allowlist; also the candidate pool for dynamic
    - NVDAx
    - TSLAx
    - AAPLx
    - MSFTx
    - AMZNx
    - GOOGLx
    - METAx
    - SPYx
    - QQQx
    - MSTRx
    - HOODx
    - CRCLx
    - GLDx
  quote: USD
  allow_outside_market_hours: true
  max_spread_bps: 100         # dynamic filter — slightly wider for thin xStocks books
  min_trade_count: 10         # dynamic filter
  min_volume: 100             # dynamic filter
  top_n: 5                    # dynamic mode: keep top-N by opportunity_score
  ranking_cache_seconds: 60

strategy:
  ensemble_weights:
    momentum: 0.40
    breakout: 0.25
    mean_reversion: 0.20
    liquidity: 0.10
    volatility_penalty: 0.10
    spread_penalty: 0.05
  thresholds:
    buy: 0.20
    sell: -0.20
  min_confidence_to_trade: 0.30

risk:
  max_open_positions: 5
  max_position_notional_usd: 1500.0
  max_total_exposure_usd: 6000.0
  max_daily_drawdown_pct: 5.0
  max_spread_bps: 60
  cooldown_seconds_per_symbol: 90
  block_unknown_symbol: true
  block_if_regime: ["LOW_LIQUIDITY", "HIGH_VOLATILITY"]
  stop_loss_pct: 1.5
  take_profit_pct: 2.5
  max_trades_per_hour: 20

execution:
  default_order_type: market
  dry_run_size_usd: 250.0
  paper_size_usd: 250.0
  live_size_usd: 100.0
  require_validate_first: true
  dead_mans_switch_seconds: 120

llm:
  enabled: false
  base_url: "https://api.featherless.ai/v1"
  model: ""
  timeout_seconds: 20
  allow_override: false

logging:
  level: INFO
  mask_secrets: true

dashboard:
  host: "127.0.0.1"
  port: 8000
  refresh_seconds: 5

# Profile-specific overrides. Only the keys that differ from the base config
# need to be listed; everything else falls through to the values above.
profiles:
  balanced:
    description: "Default profile. Reasonable thresholds, max 5 positions."
    strategy:
      ensemble_weights:
        momentum: 0.40
        breakout: 0.25
        mean_reversion: 0.20
        liquidity: 0.10
        volatility_penalty: 0.10
        spread_penalty: 0.05
      thresholds: { buy: 0.20, sell: -0.20 }
      min_confidence_to_trade: 0.30
    risk:
      max_open_positions: 5
      max_position_notional_usd: 1500.0
      max_total_exposure_usd: 6000.0
      max_daily_drawdown_pct: 5.0
      max_spread_bps: 60
      cooldown_seconds_per_symbol: 90
      stop_loss_pct: 1.5
      take_profit_pct: 2.5
      max_trades_per_hour: 20

  aggressive_competition:
    description: "Higher activity for the trading-performance track. Live opt-in unchanged."
    strategy:
      ensemble_weights:
        momentum: 0.45
        breakout: 0.30
        mean_reversion: 0.15
        liquidity: 0.10
        volatility_penalty: 0.08
        spread_penalty: 0.04
      thresholds: { buy: 0.15, sell: -0.15 }
      min_confidence_to_trade: 0.22
    risk:
      max_open_positions: 8
      max_position_notional_usd: 2500.0
      max_total_exposure_usd: 12000.0
      max_daily_drawdown_pct: 6.0
      max_spread_bps: 80
      cooldown_seconds_per_symbol: 45
      stop_loss_pct: 1.2
      take_profit_pct: 2.0
      max_trades_per_hour: 40

  conservative_debug:
    description: "Tight thresholds for local debugging."
    strategy:
      ensemble_weights:
        momentum: 0.35
        breakout: 0.20
        mean_reversion: 0.25
        liquidity: 0.15
        volatility_penalty: 0.15
        spread_penalty: 0.08
      thresholds: { buy: 0.30, sell: -0.30 }
      min_confidence_to_trade: 0.45
    risk:
      max_open_positions: 2
      max_position_notional_usd: 500.0
      max_total_exposure_usd: 1500.0
      max_daily_drawdown_pct: 3.0
      max_spread_bps: 40
      cooldown_seconds_per_symbol: 180
      stop_loss_pct: 1.0
      take_profit_pct: 1.8
      max_trades_per_hour: 6
